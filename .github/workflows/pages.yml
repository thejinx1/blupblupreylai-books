name: Deploy PDF archive to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS files
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Pull LFS content
        run: git lfs pull

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          find . -maxdepth 1 -type f -name "*.pdf" -exec cp "{}" _site/ \;

          for file in _site/*.pdf; do
            if head -c 64 "$file" | grep -q "version https://git-lfs.github.com/spec/v1"; then
              echo "$file is still a Git LFS pointer file" >&2
              exit 1
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
